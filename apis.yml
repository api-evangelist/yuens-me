aid: yuens-me
name: Sunny Yuen
description: >-
  Sunny Yuen is an independent full-stack engineer who operates a self-sovereign "Resume Agent": a
  machine-queryable professional profile served from agent.yuens.me for employer AI systems, ATS tools and
  personal assistants. The surface is an anonymous six-operation REST API described by a published OpenAPI
  3.1 document, a public remote MCP server exposing an ask_candidate tool, and an A2A 1.0 agent card, with
  the agent's identity tied to the yuens.me domain through an Ed25519 fingerprint published in DNS (Open
  Employment Protocol Phase 1). The software is MIT-licensed and published as a fork-ready reference
  implementation.
