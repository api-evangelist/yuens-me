apis:
- name: Resume Agent API
  description: >-
    Anonymous JSON API over one candidate's published professional profile: ask a natural-language question
    (queryProfile), score the candidate against a job description (matchJob), and read the structured
    profile, availability, portfolio projects and the authored observation trail behind them. Rate-limited
    to 30 requests per minute per IP; also reachable as the MCP tool ask_candidate and discoverable through
    an A2A agent card.
