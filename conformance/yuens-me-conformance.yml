domain_standard:
  market: hiring / professional profile
  declared: none
  note: >-
    The contract declares no recognised hiring-domain standard (no HR Open Standards / HR-XML, no
    JSON Resume schema, no LinkedIn or ATS interchange format). OEP is the operator's own emerging protocol and
    is recorded above as self-declared, not as domain_standard_conformance. Reward-only; nothing is claimed.
