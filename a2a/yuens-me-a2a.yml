discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: agent.yuens.me
  note: >-
    The card is served from the agent host, not the apex. yuens.me returns a real 404 for both
    /.well-known/agent-card.json and /.well-known/agent.json; www.yuens.me answers
    /.well-known/agent-card.json with a 302 to agent.yuens.me/.well-known/agent-card.json and answers
    /.well-known/agent.json (and every other unknown path) with its SPA HTML shell, which is a false
    positive and was rejected. On agent.yuens.me the legacy /.well-known/agent.json 301s to the canonical
    path, and GET / returns the same card body. Ownership is not in question: the card's provider.organization
    is "Sunny Yuen" with provider.url https://github.com/yuens1002, the OpenAPI at the same host declares
    servers[] https://agent.yuens.me, the source repo (yuens1002/resume-agent) lists agent.yuens.me as its
    homepage, and the _oep.yuens.me DNS TXT record carries the same Ed25519 fingerprint the card publishes.
  registry_listing: >-
    Surfaced via a2aregistry.org (harvest batch 2026-09-19). The registry's public search API returned zero
    results for "yuens" on 2026-09-19, so the listing could not be re-confirmed from the registry side; the
    card itself is live and is the evidence that matters.
